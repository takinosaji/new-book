image: ghcr.io/quarto-dev/quarto:latest

stages:
  - lint
  - create-artifacts
  - deploy-gh-pages
  - invoke-ai-pipeline

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

lint:
  stage: lint
  image: node:lts-alpine
  script:
    - sh sdlc/ci/pipeline-scripts/lint.sh

pages:
  stage: deploy-gh-pages
  script:
    - sh sdlc/ci/pipeline-scripts/render-website.sh
  artifacts:
    paths:
      - public
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

website:
  stage: create-artifacts
  script:
    - sh sdlc/ci/pipeline-scripts/render-website.sh
  artifacts:
    paths:
      - public
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

docx:
  stage: create-artifacts
  script:
    - sh sdlc/ci/pipeline-scripts/setup-docx-deps.sh
    - python3 sdlc/ci/build-scripts/render_book.py
  artifacts:
    paths:
      - _book/*.docx
    expire_in: 365 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success

Invoke AI/Run CodeMie Pipeline:
  stage: invoke-ai-pipeline
  image: alpine:3
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  before_script:
    - apk add --no-cache curl jq
  script:
    - sh sdlc/ci/pipeline-scripts/invoke-ai-pipeline.sh

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == 'development' || $CI_COMMIT_BRANCH == 'main'
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
